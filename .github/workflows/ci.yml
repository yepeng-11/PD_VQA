name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,models]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m pd_vqa demo --out runs/ci_demo
